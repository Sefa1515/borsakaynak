<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>BorsaKaynak Logo Seçenekleri Önizleme</title>
  <style>
    body {
      background: #08121E;
      color: #F3F7FA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 26px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      text-align: center;
      color: #8B98A9;
      margin-bottom: 40px;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .card {
      background: #111C2B;
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: #C8A96B;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #C8A96B;
    }
    .logo-container {
      width: 100%;
      height: 80px;
    }
    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <h1>BorsaKaynak — 20 Alternatif Logo Seçeneği</h1>
  <div class="subtitle">Beğendiğiniz logonun ismini (örneğin logo_secenek_3.svg) sitenizin logo.jpg dosyası olarak kaydedip kullanabilirsiniz.</div>

  <div class="grid" id="logoGrid">
    <!-- SVGs will be loaded here -->
  </div>

  <script>
    const grid = document.getElementById('logoGrid');
    for (let i = 1; i <= 20; i++) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-title">Seçenek ${i} (logo_secenek_${i}.svg)</div>
        <div class="logo-container">
          <img src="logo_secenek_${i}.svg" alt="Seçenek ${i}">
        </div>
      `;
      grid.appendChild(card);
    }
  </script>

</body>
</html>
